<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0c">
  <meta name="description" content="Este homenaje a Juan Gabriel vuelve pronto. Su música vive para siempre.">
  <title>Volvemos pronto | Homenaje a Juan Gabriel</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/artistas.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    html, body { min-width: 320px; min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background: #090a0c;
      color: #f2eee8;
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    main {
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse at 50% 43%, rgba(62, 68, 73, .23), transparent 47%),
        linear-gradient(180deg, #111214 0%, #090a0c 68%, #060607 100%);
    }

    #biografia {
      width: min(100%, 760px);
      margin: auto;
      padding: 0;
      background: transparent;
      text-align: center;
    }

    #biografia .bio-portrait {
      width: min(100%, 560px);
      margin: 0 auto;
    }

    .message {
      margin: 35px 0 0;
      color: #e7e4df;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.45rem, 3.5vw, 2rem);
      font-weight: 400;
      letter-spacing: .025em;
      line-height: 1.35;
    }

    @media (max-width: 600px) {
      main { padding: max(20px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom)); }
      #biografia .bio-portrait { width: min(100%, 430px); }
      .message { margin-top: 29px; }
    }

    .signature {
      margin: 22px 0 0;
      color: #858a8e;
      font: italic 1rem/1.2 'Cormorant Garamond', Georgia, serif;
      letter-spacing: .18em;
    }

    .audio-control {
      display: grid;
      justify-items: center;
      gap: 9px;
      margin: 24px auto 0;
    }

    .audio-toggle {
      display: inline-flex;
      min-width: 210px;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 10px 20px;
      border: 1px solid #a9afb577;
      border-radius: 999px;
      background: linear-gradient(180deg, #272a2d, #151719);
      color: #f0e8db;
      font: 500 .9rem/1.2 'Cinzel', Georgia, serif;
      letter-spacing: .035em;
      box-shadow: 0 5px 18px #0007, inset 0 1px 0 #ffffff12;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }

    .audio-toggle:hover { border-color: #d8c18e; background: linear-gradient(180deg, #333638, #1a1c1e); }
    .audio-toggle:active { transform: scale(.98); }
    .audio-toggle:focus-visible { outline: 2px solid #e6d4ad; outline-offset: 4px; }
    .audio-toggle svg { width: 17px; height: 17px; flex: 0 0 auto; fill: currentColor; }

    .audio-status {
      min-height: 1.2em;
      margin: 0;
      color: #a9a6a0;
      font-size: .98rem;
      line-height: 1.2;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main>
    <section id="biografia" aria-label="Homenaje a Juan Gabriel">
      <figure class="bio-portrait">
        <div class="portrait-frame">
          <div class="portrait-frame__inner">
            <div class="portrait-mat">
              <div class="portrait-image bio-portrait__image">
                <img src="assets/JuanGaF.webp"
                     alt="Retrato de Juan Gabriel"
                     width="691"
                     height="796"
                     fetchpriority="high"
                     decoding="async">
              </div>
            </div>
          </div>
        </div>
        <figcaption class="portrait-plaque bio-portrait__plaque">
          <img src="assets/juan-gabriel-titulo.png" alt="Juan Gabriel" decoding="async">
          <span class="bio-plaque-name">ALBERTO AGUILERA VALADEZ</span>
          <span class="bio-plaque-years">1950 – 2016</span>
        </figcaption>
      </figure>
      <p class="message">Este homenaje vuelve pronto.</p>
      <p class="signature" aria-label="Firma anónima">A.</p>
      <div class="audio-control">
        <button class="audio-toggle" id="audio-toggle" type="button" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
          <span>Reproducir canción</span>
        </button>
        <p class="audio-status" id="audio-status" role="status" aria-live="polite">Si no empieza sola, toca para escuchar.</p>
      </div>
    </section>
  </main>
  <audio id="aviso-musica" src="audios/de mi enamorate.mp3" autoplay loop preload="auto" playsinline></audio>
  <script>
    const avisoMusica = document.getElementById('aviso-musica');
    const botonAudio = document.getElementById('audio-toggle');
    const etiquetaAudio = botonAudio.querySelector('span');
    const estadoAudio = document.getElementById('audio-status');

    function sincronizarAudio() {
      const reproduciendo = !avisoMusica.paused;
      botonAudio.setAttribute('aria-pressed', String(reproduciendo));
      etiquetaAudio.textContent = reproduciendo ? 'Pausar canción' : 'Reproducir canción';
      botonAudio.querySelector('svg path').setAttribute('d', reproduciendo
        ? 'M6 5h4v14H6zm8 0h4v14h-4z'
        : 'M8 5v14l11-7z');
      estadoAudio.textContent = reproduciendo
        ? 'De mí enamórate'
        : 'Si no empieza sola, toca para escuchar.';
    }

    botonAudio.addEventListener('click', () => {
      if (avisoMusica.paused) {
        avisoMusica.play().then(sincronizarAudio).catch(() => {
          estadoAudio.textContent = 'No se pudo reproducir. Toca de nuevo para intentarlo.';
        });
      } else {
        avisoMusica.pause();
        sincronizarAudio();
      }
    });

    avisoMusica.addEventListener('play', sincronizarAudio);
    avisoMusica.addEventListener('pause', sincronizarAudio);
    avisoMusica.addEventListener('ended', sincronizarAudio);
    avisoMusica.play().then(sincronizarAudio).catch(sincronizarAudio);
  </script>
</body>
</html>
